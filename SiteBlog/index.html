<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Blog</h1>
        <p>Criação de artigos</p>
    </header>
    <main class="layout-blog">
        <aside class="sibebar-criacao">
            <h2>Criar Novo Post</h2>
            <form id="form-novo-post">
                <div class="campo">
                    <label for="titulo">Título do Artigo</label>
                    <input type="text" id="titulo" required aria-placeholder="Ex: Aprendendo sobre Arrays">
                </div>

                <div class="campo">
                    <label for="autor">Seu Nome (Autor)</label>
                    <input type="text" id="autor" required placeholder="Ex: André Costa">
                </div>
                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="tecnologia">Tecnologia</option>
                        <option value="estudos">Estudos</option>
                        <option value="carreira">Carreira</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="conteudo">Conteúdo do Post</label>
                    <textarea id="conteudo" rows="6" required placeholder="Escreva seu texto aqui..."></textarea>
                </div>

                <button type="submit" id="btn-publicar">Publicar Post</button>
            </form>
        </aside>
        <section class="feed-posts">
            <h2>Artigos Recentes</h2>
            <div id="containder-posts"></div>
        </section>
    </main>
    <footer>
        Desenvolvido por <strong>Thaís Midlej Rocha</strong>.
    </footer>
    <script src="script.js"></script>
</body>
</html>
